<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>theburkeanparlor</title>
    <!--
      GitHub Pages serves this file for any unknown path (deep links like
      /theburkeanparlor/About), since it's a static host with no server-side
      router. This redirects back to index.html with the original path
      encoded in a query string so index.html's inline script can restore it
      and let react-router take over client-side.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keep "/theburkeanparlor"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
